<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Voice samples</title><style>
body{margin:0;padding:20px 16px 60px;background:#131c29;color:#f3efe2;font-family:-apple-system,system-ui,sans-serif;max-width:520px;margin-inline:auto}
h1{font-size:1.2rem;color:#dcb02c} p{color:#93a0b4;font-size:.9rem}
section{background:#1b2738;border:1px solid #2f3f57;border-radius:14px;padding:14px;margin:14px 0}
h2{margin:0 0 10px;font-size:1.05rem} .b{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{padding:10px 14px;border-radius:20px;border:1px solid #2f3f57;background:transparent;color:#f3efe2;font-size:.9rem}
button.all{background:#dcb02c;color:#131c29;border:0;font-weight:700} button.on{background:#dcb02c;color:#131c29}
</style></head><body><h1>Voice samples</h1>
<p>Four voices reading the same eight phrases. Tap any phrase, or play the whole set. Tell me which voice you like (A, B, C or D).</p>
<section><h2>Voice A</h2><button class="all" data-all="en_US-joe-medium">▶ Play the whole set</button><div class="b"><button data-src="en_US-joe-medium/01-stance-and-motion-wrestlers-ready.wav">Stance and Motion. Wrestlers ready.</button><button data-src="en_US-joe-medium/02-go.wav">Go!</button><button data-src="en_US-joe-medium/03-level-change.wav">Level change</button><button data-src="en_US-joe-medium/04-sprawl.wav">Sprawl</button><button data-src="en_US-joe-medium/05-hip-heist.wav">Hip heist</button><button data-src="en_US-joe-medium/06-tight-waist.wav">Tight waist</button><button data-src="en_US-joe-medium/07-rest.wav">Rest</button><button data-src="en_US-joe-medium/08-workout-complete.wav">Workout complete</button></div></section><section><h2>Voice B</h2><button class="all" data-all="en_US-john-medium">▶ Play the whole set</button><div class="b"><button data-src="en_US-john-medium/01-stance-and-motion-wrestlers-ready.wav">Stance and Motion. Wrestlers ready.</button><button data-src="en_US-john-medium/02-go.wav">Go!</button><button data-src="en_US-john-medium/03-level-change.wav">Level change</button><button data-src="en_US-john-medium/04-sprawl.wav">Sprawl</button><button data-src="en_US-john-medium/05-hip-heist.wav">Hip heist</button><button data-src="en_US-john-medium/06-tight-waist.wav">Tight waist</button><button data-src="en_US-john-medium/07-rest.wav">Rest</button><button data-src="en_US-john-medium/08-workout-complete.wav">Workout complete</button></div></section><section><h2>Voice C</h2><button class="all" data-all="en_US-bryce-medium">▶ Play the whole set</button><div class="b"><button data-src="en_US-bryce-medium/01-stance-and-motion-wrestlers-ready.wav">Stance and Motion. Wrestlers ready.</button><button data-src="en_US-bryce-medium/02-go.wav">Go!</button><button data-src="en_US-bryce-medium/03-level-change.wav">Level change</button><button data-src="en_US-bryce-medium/04-sprawl.wav">Sprawl</button><button data-src="en_US-bryce-medium/05-hip-heist.wav">Hip heist</button><button data-src="en_US-bryce-medium/06-tight-waist.wav">Tight waist</button><button data-src="en_US-bryce-medium/07-rest.wav">Rest</button><button data-src="en_US-bryce-medium/08-workout-complete.wav">Workout complete</button></div></section><section><h2>Voice D</h2><button class="all" data-all="en_US-norman-medium">▶ Play the whole set</button><div class="b"><button data-src="en_US-norman-medium/01-stance-and-motion-wrestlers-ready.wav">Stance and Motion. Wrestlers ready.</button><button data-src="en_US-norman-medium/02-go.wav">Go!</button><button data-src="en_US-norman-medium/03-level-change.wav">Level change</button><button data-src="en_US-norman-medium/04-sprawl.wav">Sprawl</button><button data-src="en_US-norman-medium/05-hip-heist.wav">Hip heist</button><button data-src="en_US-norman-medium/06-tight-waist.wav">Tight waist</button><button data-src="en_US-norman-medium/07-rest.wav">Rest</button><button data-src="en_US-norman-medium/08-workout-complete.wav">Workout complete</button></div></section>
<script>
let cur=null;
function play(src,done){ if(cur){cur.pause();} const a=new Audio(src); cur=a; a.onended=()=>done&&done(); a.play().catch(()=>done&&done()); }
document.querySelectorAll("button[data-src]").forEach(b=>b.onclick=()=>play(b.dataset.src));
document.querySelectorAll("button[data-all]").forEach(b=>b.onclick=()=>{
  const list=[...b.parentElement.querySelectorAll("button[data-src]")];let i=0;
  const next=()=>{ list.forEach(x=>x.classList.remove("on")); if(i>=list.length)return; list[i].classList.add("on"); play(list[i].dataset.src,()=>setTimeout(next,450)); i++; };next();
});
</script></body></html>
